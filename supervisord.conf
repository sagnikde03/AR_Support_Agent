[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info

[program:webhook]
command=uvicorn api.main:app --host 0.0.0.0 --port 8001 --workers 2
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/webhook.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:slackbot]
command=python slack_bot/bot.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/slack.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:ar_poller]
command=python -m ar_agent.poller.ar_poller
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/poller.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
